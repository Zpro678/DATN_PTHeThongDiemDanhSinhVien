services:

  mysql:
    image: mysql:8.4
    container_name: attendance_mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_quan_ly_diem_danh

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: attendance_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
