services:

  mysql:
    image: mysql:8.4
    container_name: attendance_mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_quan_ly_diem_danh

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: attendance_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: attendance_phpmyadmin

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root

    depends_on:
      - mysql

volumes:
  mysql_data:
  redis_data:
