services:
  mysql:
    image: mysql:8.4
    container_name: attendance_mysql
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-db_quan_ly_diem_danh_v2}

    volumes:
      - mysql_model_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD:-root}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: attendance_phpmyadmin
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-root}
      UPLOAD_LIMIT: 128M

  socketio:
    build:
      context: ./socket-server
      dockerfile: Dockerfile

    container_name: attendance_socketio
    restart: unless-stopped

    depends_on:
      - redis

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000

      # Socket.IO nằm trong Docker nên kết nối Redis bằng tên service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      CORS_ORIGIN: ${APP_URL:-http://127.0.0.1:8000}

    volumes:
      - ./socket-server:/app
      - socket_node_modules:/app/node_modules

volumes:
  mysql_model_data:
  redis_data:
  socket_node_modules: