; ============================================================================
;  Supervisor trong container `app` (production).
;  Chạy song song: php-fpm + 3 nhóm queue worker (theo ưu tiên) + scheduler.
;  Tương ứng với scripts/supervisor-queues.conf.example khi cài trực tiếp trên VPS.
; ============================================================================
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- Import: nhiều worker để nhiều tài khoản import song song ----
[program:worker-imports]
command=php /var/www/html/artisan queue:work redis --queue=imports --sleep=1 --tries=3 --max-time=3600
user=www-data
numprocs=4
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- Mail: ít worker để tiết chế SMTP ----
[program:worker-mails]
command=php /var/www/html/artisan queue:work redis --queue=mails --sleep=2 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- Default: thông báo realtime, audit, callback batch... ----
[program:worker-default]
command=php /var/www/html/artisan queue:work redis --queue=default --sleep=1 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- Scheduler: chốt buổi quá giờ, flush mail outbox, backup DB... ----
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
